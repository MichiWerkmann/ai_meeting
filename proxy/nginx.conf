events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 512m;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name localhost 127.0.0.1 _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost 127.0.0.1 _;
        set $frontend_upstream http://frontend:4173;
        set $backend_upstream http://backend:8000;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_buffering off;

        location = /api {
            proxy_pass $backend_upstream/api;
        }

        location /api/ {
            proxy_pass $backend_upstream;
        }

        location = /health {
            proxy_pass $backend_upstream/health;
        }

        location = /docs {
            proxy_pass $backend_upstream/docs;
        }

        location = /openapi.json {
            proxy_pass $backend_upstream/openapi.json;
        }

        location / {
            proxy_pass $frontend_upstream;
        }
    }
}
