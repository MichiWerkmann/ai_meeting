# Aurora Minutes – Production Compose (Azure-only, Auto-Update via Watchtower)
# Verwendung auf Remote-Deployments:
#   1. .env.prod mit Konfiguration füllen (s. .env.prod.example)
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Watchtower pollt alle 5 Minuten ghcr.io nach neuen :latest Images
# und führt automatisch ein recreate inkl. healthcheck durch.

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "${REVERSE_PROXY_PORT:-9443}:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/michiwerkmann/ai-meeting-backend:latest}
    pull_policy: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    expose:
      - "8000"
    volumes:
      - aurora-backend-data:/app/data
    environment:
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-azure_speech}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-germanywestcentral}
      AZURE_SPEECH_ENDPOINT: ${AZURE_SPEECH_ENDPOINT:-https://germanywestcentral.api.cognitive.microsoft.com/}
      AZURE_SPEECH_LOCALES: ${AZURE_SPEECH_LOCALES:-}
      AZURE_SPEECH_MAX_SPEAKERS: ${AZURE_SPEECH_MAX_SPEAKERS:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gpt-4.1-mini}
      TRANSCRIPTION_MAX_CONCURRENT_JOBS: ${TRANSCRIPTION_MAX_CONCURRENT_JOBS:-2}
      LLM_PROVIDER: ${LLM_PROVIDER:-azure_openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_AZURE_ENDPOINT: ${LLM_AZURE_ENDPOINT:-https://modelle-michi.openai.azure.com}
      LLM_AZURE_API_KEY: ${LLM_AZURE_API_KEY:-}
      LLM_AZURE_API_VERSION: ${LLM_AZURE_API_VERSION:-2025-01-01-preview}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_COMPLETIONS_PATH: ${LLM_COMPLETIONS_PATH:-/v1/chat/completions}
      MEETING_WEBHOOK_URL: ${MEETING_WEBHOOK_URL:-}
      SPEAKER_RECOGNITION_ENABLED: ${SPEAKER_RECOGNITION_ENABLED:-true}
      SEND_ENABLED: ${SEND_ENABLED:-true}
      MEETING_WEBHOOK_TIMEOUT_SECONDS: ${MEETING_WEBHOOK_TIMEOUT_SECONDS:-20}
      MEETING_WEBHOOK_MAX_RETRIES: ${MEETING_WEBHOOK_MAX_RETRIES:-3}
      MEETING_WEBHOOK_BACKOFF_SECONDS: ${MEETING_WEBHOOK_BACKOFF_SECONDS:-1}
      MEETING_WEBHOOK_VERIFY_TLS: ${MEETING_WEBHOOK_VERIFY_TLS:-true}
      MEETING_WEBHOOK_CA_CERT_PATH: ${MEETING_WEBHOOK_CA_CERT_PATH:-}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/michiwerkmann/ai-meeting-frontend:latest}
    pull_policy: always
    expose:
      - "4173"
    environment:
      API_BASE_URL: ${API_BASE_URL:-same-origin}
      API_PORT: ""
      MEETING_WEBHOOK_URL: ${MEETING_WEBHOOK_URL:-}
      UI_THEME: ${UI_THEME:-aurora}
      SPEAKER_RECOGNITION_ENABLED: ${SPEAKER_RECOGNITION_ENABLED:-true}
      SEND_ENABLED: ${SEND_ENABLED:-true}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WATCHTOWER_CONFIG_DIR:-./.watchtower}:/config
    environment:
      # Nur explizit gelabelte Container updaten (reverse-proxy bleibt unangetastet)
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      DOCKER_CONFIG: /config/.docker
      TZ: ${TZ:-Europe/Berlin}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  aurora-backend-data:
